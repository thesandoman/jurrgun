name: Deploy to SV Cloud

# Managed by SV Cloud. Do NOT edit this file — the SV Cloud API re-validates
# your framework at deploy time, and changes here will break or lock out deploys.
#
# TWO WAYS IN, and which one applies depends on whether you have turned on a
# staging environment:
#
#   push to main   no staging  -> deploys your live app
#                                staging on  -> deploys your STAGING app
#   push a `prod-*` tag          promotes that exact commit to your live app
#
# Until you turn staging on, this file behaves exactly as it always has: the
# branch job deploys your live app and the tag job refuses with a clear message.
# That is what makes it safe to take this update before deciding anything.
#
# USE A NEW TAG FOR EVERY PROMOTION (`prod-2026-09-17.1`), never a moving `prod`
# tag. A moving tag needs a force-push and makes "which commit is live" a
# question nobody can answer; SV Cloud refuses to reuse one on a different
# commit. Re-running the same tag on the same commit is a safe retry.
#
# NOTE ON TAGS AND `paths:` — GitHub does not evaluate path filters for tag
# pushes, so adding one to this trigger would silently mean something different
# for each half. Do not add one.

on:
  push:
    branches: [main]
    tags: ["prod-*"]

# OIDC: lets this job mint a short-lived token GitHub signs and the SV Cloud
# API verifies. Removing `id-token: write` breaks authentication — leave it.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    concurrency:
      group: cloud-deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # v5 of these actions runs on the runner's Node 24; the v4 releases target
      # Node 20, which GitHub deprecated and now force-runs on 24 with a warning.
      #
      # lfs is deliberately FALSE: design/assets/ checks out as small LFS
      # pointer text, and the sync step below pulls the real bytes for the few
      # files that are not already in storage. Pulling them all here is what made
      # a media-heavy repo pay for its entire asset folder on every push.
      - uses: actions/checkout@v5
        with:
          lfs: false
          fetch-depth: 0

      # Uses setup-node with npm caching enabled against the starter package-lock.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Fast local guard before burning build minutes. The SV Cloud API re-checks
      # this server-side at deploy time at the attested commit SHA — this step
      # is only quick feedback, not the security boundary.
      - name: Verify framework dependency
        run: |
          node -e "const p=require('./package.json');const d={...p.dependencies,...p.devDependencies};if(!d['hono']){console.error('::error::Missing required dependency hono');process.exit(1)}"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # Gates before the build: a type error or a failing test stops the deploy
      # rather than shipping a broken site. Fix the code, don't skip the test.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Catches a stale src/assets.ts (forgot to run `npm run assets`) or an
      # oversized/unsupported file in design/assets/ before anything uploads.
      - name: Check design assets
        run: npm run assets:check

      # --dry-run bundles the Worker WITHOUT deploying it, so no hosting
      # credentials are ever present on this runner. SV Cloud pushes the artifact.
      - name: Build Worker bundle
        run: npx wrangler deploy --dry-run --outdir dist

      - name: Sync design assets
        env:
          CLOUD_API_URL: "https://api.cloud.sv-academy.org"
        run: bash .github/workflows/sync-assets.sh

      # All in one step so the OIDC token never leaves the runner step.
      #
      # wrangler's dry-run bundle is the Worker's WHOLE module graph, not just
      # its entry point: any non-JS import (a built client's "./index.html",
      # most commonly) lands as a sibling file directly in dist/ that
      # index.js imports by name — every one of them has to reach SV Cloud, or
      # the script upload fails outright with a "no such module" error. dist/
      # can also hold files that are NOT part of that graph (wrangler's own
      # dry-run output copies a stray README.md in there, for one) — rather
      # than guess which stray files are safe to skip, read index.js's own
      # relative import specifiers and upload exactly that set, nothing more.
      - name: Deploy to SV Cloud
        env:
          CLOUD_API_URL: "https://api.cloud.sv-academy.org"
        run: |
          set -euo pipefail
          OIDC=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$CLOUD_API_URL" | jq -r '.value')
          MODULES=$(node -e '
          const fs = require("fs");
          const src = fs.readFileSync("dist/index.js", "utf8");
          const names = new Set(["index.js"]);
          for (const m of src.matchAll(/from "\.\/([^"]+)"/g)) names.add(m[1]);
          process.stdout.write([...names].join("\n"));
          ')
          while IFS= read -r NAME; do
            [ -z "$NAME" ] && continue
            URL=$(curl -sSf -G -H "Authorization: Bearer $OIDC" \
              --data-urlencode "path=$NAME" \
              "$CLOUD_API_URL/api/v1/projects/deploy/upload-url" | jq -r '.url')
            curl -sSf -X PUT --upload-file "dist/$NAME" \
              -H "content-type: application/octet-stream" "$URL"
          done <<< "$MODULES"
          RESULT=$(curl -sSf -X POST \
            -H "Authorization: Bearer $OIDC" \
            -H "content-type: application/json" \
            "$CLOUD_API_URL/api/v1/projects/deploy")
          echo "$RESULT" | jq -r '.environment // "production"' | {
            read -r ENVIRONMENT
            echo "Deployed to: $ENVIRONMENT"
          }
          # Printed so the first thing you see after turning staging on is that
          # your push went to staging, rather than wondering later why the live
          # site never changed.
          echo "$RESULT" | jq -r '.note // empty'

  # Promotion does NOT build. The bytes staging already built for this exact
  # commit are what get pushed, so what goes live is what was tested rather than
  # a fresh build of the same source that ought to agree.
  #
  # It still syncs design assets, because those are not part of the Worker
  # bundle and your live app has its own separate storage. Every upload is
  # additive: assets are addressed by their content, so this can only ever add
  # files your live app did not have, never overwrite one.
  promote:
    if: startsWith(github.ref, 'refs/tags/prod-')
    runs-on: ubuntu-latest
    concurrency:
      # Not cancel-in-progress: interrupting a promotion halfway is worse than
      # making the next one wait.
      group: cloud-promote
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          fetch-depth: 0

      - name: Sync design assets
        env:
          CLOUD_API_URL: "https://api.cloud.sv-academy.org"
        run: bash .github/workflows/sync-assets.sh

      - name: Promote to production
        env:
          CLOUD_API_URL: "https://api.cloud.sv-academy.org"
        run: |
          set -euo pipefail
          OIDC=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$CLOUD_API_URL" | jq -r '.value')
          RESULT=$(curl -sSf -X POST \
            -H "Authorization: Bearer $OIDC" \
            -H "content-type: application/json" \
            "$CLOUD_API_URL/api/v1/projects/deploy/promote")
          echo "Promoted $(echo "$RESULT" | jq -r '.deployed_commit_sha') to production."
          echo "Live at: $(echo "$RESULT" | jq -r '.deployment_url')"
